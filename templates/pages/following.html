<div class="eyebrow">BEFORE YOU EVEN LEAVE</div><h1>Places you follow.</h1><p class="greeting-sub">Save the road you care about without sharing your live location.</p>
<form class="persistent-form" method="post" action="{% url 'save-preferences' %}" data-preference-form>{% csrf_token %}<input type="hidden" name="travel_mode" value="{{ preference.travel_mode }}"><input type="hidden" name="next" value="{% url 'following' %}">
<div class="settings-row"><label for="follow"><strong>Market Road, Yaba</strong><p>Show this road in your local briefing.</p></label><input id="follow" name="follow_market_road" type="checkbox" {% if preference.follow_market_road %}checked{% endif %}></div>
<div class="settings-row"><label for="follow-area"><strong>Yaba area updates</strong><p>Include relevant area briefings when an exact location is unknown.</p></label><input id="follow-area" name="follow_yaba_area" type="checkbox" {% if preference.follow_yaba_area %}checked{% endif %}></div>
<div class="settings-row"><label for="mute"><strong>Mute automatic update cards</strong><p>Briefings remain readable; the scripted presentation has its own playback controls.</p></label><input id="mute" name="muted" type="checkbox" {% if preference.muted %}checked{% endif %}></div>
<button type="submit" class="primary-button mt-6">Save preferences</button><div class="save-state" role="status"></div></form><p class="fine-print">Preferences are stored for this browser’s anonymous session.</p>
